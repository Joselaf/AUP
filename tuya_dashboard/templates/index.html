<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuya Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface2: #1a1e2a;
      --border: rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.15);
      --text: #e8eaf0;
      --muted: #6b7280;
      --accent: #4ade80;
      --accent2: #22d3ee;
      --warn: #f59e0b;
      --danger: #ef4444;
      --purple: #a78bfa;

      --c-breaker: #22d3ee;
      --c-lock: #a78bfa;
      --c-heater: #f59e0b;
      --c-plug: #4ade80;
      --c-bulb: #fde68a;
      --c-sensor: #fb923c;
      --c-esmax: #f472b6;
      --c-ir: #94a3b8;
      --c-tv: #60a5fa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,15,20,0.92);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .logo-dot {
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .logo h1 {
      font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em;
    }
    .logo h1 span { color: var(--accent); }

    .header-right {
      display: flex; align-items: center; gap: 1rem;
    }
    #last-refresh {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem; color: var(--muted);
    }
    .btn-refresh {
      background: var(--surface2); border: 1px solid var(--border-hi);
      color: var(--text); font-family: 'Syne', sans-serif;
      font-size: 0.8rem; font-weight: 600;
      padding: 0.4rem 0.9rem; border-radius: 6px;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-refresh:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }

    /* ── Layout ── */
    .app { display: flex; height: calc(100vh - 61px); }

    /* ── Sidebar ── */
    aside {
      width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex; flex-direction: column; gap: 0.25rem;
      overflow-y: auto;
    }

    .sidebar-label {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em;
      color: var(--muted); text-transform: uppercase;
      padding: 0.5rem 0.5rem 0.25rem;
    }

    .filter-btn {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      border: none; background: transparent;
      color: var(--muted); font-family: 'Syne', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      border-radius: 7px; cursor: pointer;
      transition: all 0.15s; text-align: left;
      width: 100%;
    }
    .filter-btn .count {
      margin-left: auto;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      background: var(--surface2);
      padding: 1px 6px; border-radius: 4px;
    }
    .filter-btn:hover { background: var(--surface2); color: var(--text); }
    .filter-btn.active { background: var(--surface2); color: var(--text); }
    .filter-btn.active .dot { box-shadow: 0 0 8px currentColor; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Main ── */
    main {
      flex: 1; overflow-y: auto;
      padding: 1.5rem 2rem;
    }

    .search-bar {
      margin-bottom: 1.5rem;
    }
    #search-input {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 1rem;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #search-input:focus { border-color: var(--border-hi); }
    #search-input::placeholder { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    /* ── Device Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--type-color, var(--border));
      opacity: 0.7;
    }
    .card:hover { border-color: var(--border-hi); transform: translateY(-1px); }
    .card.selected { border-color: var(--type-color, var(--accent)); }

    .card-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .card-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      background: color-mix(in srgb, var(--type-color, #666) 15%, transparent);
    }
    .card-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem; font-weight: 500;
      padding: 2px 7px; border-radius: 4px;
      background: color-mix(in srgb, var(--type-color, #666) 15%, transparent);
      color: var(--type-color, var(--muted));
      border: 1px solid color-mix(in srgb, var(--type-color, #666) 30%, transparent);
    }

    .card-name {
      font-size: 0.9rem; font-weight: 600; color: var(--text);
      margin-bottom: 0.15rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-product {
      font-size: 0.72rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-footer {
      margin-top: 0.8rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-ip {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem; color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .status-dot.offline { background: var(--danger); }

    /* ── Panel ── */
    #panel {
      width: 380px; flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: none; flex-direction: column;
    }
    #panel.open { display: flex; }

    .panel-header {
      padding: 1.2rem 1.4rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.8rem;
    }
    .panel-type-bar {
      width: 4px; height: 32px; border-radius: 2px;
      background: var(--type-color, var(--muted));
    }
    .panel-title { font-size: 1rem; font-weight: 700; }
    .panel-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .panel-close {
      margin-left: auto;
      background: transparent; border: none;
      color: var(--muted); font-size: 1.2rem; cursor: pointer;
      line-height: 1; padding: 0.2rem;
      transition: color 0.15s;
    }
    .panel-close:hover { color: var(--text); }

    .panel-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.4rem; }

    .panel-section { margin-bottom: 1.5rem; }
    .panel-section-title {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .stat-card {
      background: var(--surface2); border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }
    .stat-label { font-size: 0.65rem; color: var(--muted); margin-bottom: 2px; }
    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 1rem; font-weight: 500;
      color: var(--type-color, var(--text));
    }
    .stat-unit { font-size: 0.65rem; color: var(--muted); }

    /* Controls */
    .ctrl-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .ctrl-row:last-child { border-bottom: none; }
    .ctrl-label { font-size: 0.82rem; }

    .toggle {
      position: relative; width: 40px; height: 22px;
      cursor: pointer;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--surface2); border: 1px solid var(--border-hi);
      border-radius: 11px; transition: 0.2s;
    }
    .toggle input:checked + .toggle-track {
      background: var(--type-color, var(--accent));
      border-color: var(--type-color, var(--accent));
    }
    .toggle-track::after {
      content: ''; position: absolute;
      width: 16px; height: 16px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .toggle input:checked + .toggle-track::after { transform: translateX(18px); }

    .btn-action {
      background: color-mix(in srgb, var(--type-color, #666) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--type-color, #666) 40%, transparent);
      color: var(--type-color, var(--text));
      font-family: 'Syne', sans-serif; font-size: 0.78rem; font-weight: 600;
      padding: 0.4rem 0.85rem; border-radius: 6px; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-action:hover { opacity: 0.8; }
    .input-inline {
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      color: var(--text);
      border-radius: 6px;
      padding: 0.42rem 0.55rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.76rem;
      width: 100%;
      outline: none;
    }
    .input-inline:focus { border-color: var(--accent2); }
    .cmd-row {
      display: grid;
      grid-template-columns: 1fr 170px auto;
      gap: 0.5rem;
      align-items: center;
    }
    .cmd-meta {
      min-width: 0;
    }
    .cmd-title {
      font-size: 0.76rem;
      color: var(--text);
      margin-bottom: 0.16rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cmd-desc {
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 0.16rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cmd-allowed {
      font-size: 0.66rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poll-btn {
      width: 100%; margin-top: 0.5rem;
      background: var(--surface2); border: 1px solid var(--border-hi);
      color: var(--text); font-family: 'Syne', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      padding: 0.55rem; border-radius: 8px; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .poll-btn:hover { border-color: var(--type-color, var(--accent)); color: var(--type-color, var(--accent)); }
    .poll-btn.loading { opacity: 0.6; pointer-events: none; }

    .no-ip-msg {
      font-size: 0.78rem; color: var(--warn);
      background: color-mix(in srgb, var(--warn) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
      border-radius: 7px; padding: 0.6rem 0.8rem;
    }

    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: currentColor;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* empty state */
    .empty {
      padding: 3rem; text-align: center; color: var(--muted);
      font-size: 0.85rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <h1>Tuya <span>Dashboard</span> <small style="font-size:0.65rem;color:var(--accent2);font-weight:600">{{ ui_version }}</small></h1>
  </div>
  <div class="header-right">
    <span id="last-refresh">loading…</span>
    <button class="btn-refresh" onclick="downloadCommandsMatrix('json')">⇩ Commands JSON</button>
    <button class="btn-refresh" onclick="downloadCommandsMatrix('csv')">⇩ Commands CSV</button>
    <button class="btn-refresh" onclick="loadDevices()">⟳ Refresh</button>
  </div>
</header>

<div class="app">
  <aside id="sidebar">
    <div class="sidebar-label">Filter by type</div>
    <button class="filter-btn active" data-type="all" onclick="setFilter('all', this)">
      <span class="dot" style="background:#6b7280"></span> All devices
      <span class="count" id="count-all">—</span>
    </button>
    <button class="filter-btn" data-type="breaker" onclick="setFilter('breaker', this)">
      <span class="dot" style="background:var(--c-breaker)"></span> Breakers
      <span class="count" id="count-breaker">—</span>
    </button>
    <button class="filter-btn" data-type="lock" onclick="setFilter('lock', this)">
      <span class="dot" style="background:var(--c-lock)"></span> Locks
      <span class="count" id="count-lock">—</span>
    </button>
    <button class="filter-btn" data-type="heater" onclick="setFilter('heater', this)">
      <span class="dot" style="background:var(--c-heater)"></span> Heaters
      <span class="count" id="count-heater">—</span>
    </button>
    <button class="filter-btn" data-type="smart_plug" onclick="setFilter('smart_plug', this)">
      <span class="dot" style="background:var(--c-plug)"></span> Plugs / Switches
      <span class="count" id="count-smart_plug">—</span>
    </button>
    <button class="filter-btn" data-type="bulb" onclick="setFilter('bulb', this)">
      <span class="dot" style="background:var(--c-bulb)"></span> Bulbs
      <span class="count" id="count-bulb">—</span>
    </button>
    <button class="filter-btn" data-type="esmax" onclick="setFilter('esmax', this)">
      <span class="dot" style="background:var(--c-esmax)"></span> ESMAX
      <span class="count" id="count-esmax">—</span>
    </button>
    <button class="filter-btn" data-type="smart_ir" onclick="setFilter('smart_ir', this)">
      <span class="dot" style="background:var(--c-ir)"></span> IR
      <span class="count" id="count-smart_ir">—</span>
    </button>
    <button class="filter-btn" data-type="smart_tv" onclick="setFilter('smart_tv', this)">
      <span class="dot" style="background:var(--c-tv)"></span> TV
      <span class="count" id="count-smart_tv">—</span>
    </button>
    <button class="filter-btn" data-type="presence_sensor" onclick="setFilter('presence_sensor', this)">
      <span class="dot" style="background:var(--c-sensor)"></span> Sensors
      <span class="count" id="count-presence_sensor">—</span>
    </button>
    <button class="filter-btn" data-type="contact_sensor" onclick="setFilter('contact_sensor', this)">
      <span class="dot" style="background:var(--c-sensor)"></span> Contact
      <span class="count" id="count-contact_sensor">—</span>
    </button>
    <button class="filter-btn" data-type="smart_lock" onclick="setFilter('smart_lock', this)">
      <span class="dot" style="background:var(--c-lock)"></span> Smart Locks
      <span class="count" id="count-smart_lock">—</span>
    </button>
  </aside>

  <main>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search devices…" oninput="renderGrid()">
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <div id="panel">
    <div class="panel-header">
      <div class="panel-type-bar" id="panel-bar"></div>
      <div>
        <div class="panel-title" id="panel-name">—</div>
        <div class="panel-sub" id="panel-sub">—</div>
      </div>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<script>
const TYPE_META = {
  breaker:          { label: "Circuit Breaker", icon: "⚡", color: "var(--c-breaker)" },
  consumption_breaker: { label: "Consumption Breaker", icon: "📊", color: "var(--c-breaker)" },
  general_circuit_breaker: { label: "General Breaker", icon: "⚡", color: "var(--c-breaker)" },
  lock:             { label: "Smart Lock", icon: "🔒", color: "var(--c-lock)" },
  smart_lock:       { label: "Smart Lock Pro", icon: "🔐", color: "var(--c-lock)" },
  heater:           { label: "Heater", icon: "🔥", color: "var(--c-heater)" },
  smart_plug:       { label: "Smart Plug", icon: "🔌", color: "var(--c-plug)" },
  bulb:             { label: "Smart Bulb", icon: "💡", color: "var(--c-bulb)" },
  esmax:            { label: "ESMAX Scooter", icon: "🛵", color: "var(--c-esmax)" },
  smart_ir:         { label: "IR Remote", icon: "📡", color: "var(--c-ir)" },
  smart_tv:         { label: "Smart TV", icon: "📺", color: "var(--c-tv)" },
  presence_sensor:  { label: "Presence Sensor", icon: "👁", color: "var(--c-sensor)" },
  contact_sensor:   { label: "Contact Sensor", icon: "🚪", color: "var(--c-sensor)" },
  unknown:          { label: "Unknown", icon: "❓", color: "var(--muted)" },
};

let allDevices = [];
let currentFilter = "all";
let selectedId = null;

function safeText(value) {
  if (value === null || value === undefined) return "";
  return String(value);
}

async function loadDevices() {
  const grid = document.getElementById("grid");
  try {
    const r = await fetch("/api/devices");
    if (!r.ok) {
      throw new Error(`HTTP ${r.status}`);
    }
    const payload = await r.json();
    allDevices = Array.isArray(payload) ? payload : [];
    updateCounts();
    renderGrid();
    document.getElementById("last-refresh").textContent =
      "Updated " + new Date().toLocaleTimeString();
  } catch (err) {
    allDevices = [];
    updateCounts();
    if (grid) {
      grid.innerHTML = `<div class="empty" style="color:var(--danger)">Failed to load devices: ${safeText(err.message || err)}</div>`;
    }
    document.getElementById("last-refresh").textContent = "Load failed";
  }
}

function updateCounts() {
  const counts = {};
  // Only count devices with local IPs
  const localDevices = allDevices.filter(d => {
    const ip = d.ip || "";
    return ip && (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172."));
  });
  localDevices.forEach(d => { counts[d.type] = (counts[d.type] || 0) + 1; });
  document.getElementById("count-all").textContent = localDevices.length;
  for (const [type, n] of Object.entries(counts)) {
    const el = document.getElementById("count-" + type);
    if (el) el.textContent = n;
  }
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderGrid();
}

function renderGrid() {
  const query = safeText(document.getElementById("search-input").value).toLowerCase();
  let devices = allDevices;
  // Only show devices with local IPs (192.168.x.x, 10.x.x.x, 172.x.x.x)
  devices = devices.filter(d => {
    const ip = d.ip || "";
    return ip && (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172."));
  });
  if (currentFilter !== "all") devices = devices.filter(d => d.type === currentFilter);
  if (query) devices = devices.filter(d =>
    safeText(d.name).toLowerCase().includes(query) ||
    safeText(d.product_name).toLowerCase().includes(query)
  );

  const grid = document.getElementById("grid");
  if (!devices.length) {
    grid.innerHTML = '<div class="empty">No devices found.</div>';
    return;
  }

  grid.innerHTML = devices.map(d => {
    const meta = TYPE_META[d.type] || TYPE_META.unknown;
    const hasIp = !!d.ip;
    const powerDps = getPowerDps(d);
    const supportedCommands = getSupportedCommands(d);
    const commandRows = supportedCommands.map(cmd => {
      const inputId = `cmd-${safeIdPart(d.id)}-${safeIdPart(cmd.dps)}`;
      return `
        <div class="stat-card" style="padding:0.5rem 0.6rem">
          <div class="cmd-row">
            <div class="cmd-meta">
              <div class="cmd-title">${cmd.code} <span style="opacity:0.8">(DPS ${cmd.dps})</span></div>
              <div class="cmd-desc">${cmd.description}</div>
              <div class="cmd-allowed">Allowed: ${cmd.allowed}</div>
            </div>
            <input class="input-inline" id="${inputId}" placeholder="${cmd.placeholder}">
            <button class="btn-action" onclick="sendInlineCommand('${d.id}','${cmd.code}','${inputId}')">Send</button>
          </div>
        </div>
      `;
    }).join("");
    return `
    <div class="card" style="--type-color:${meta.color};cursor:default">
      <div class="card-header">
        <div class="card-icon">${meta.icon}</div>
        <span class="card-badge">${meta.label}</span>
      </div>
      <div class="card-name">${d.name}</div>
      <div class="card-product">${d.product_name}</div>
      <div class="card-footer">
        <span class="card-ip">${d.ip || 'No IP'}</span>
        <span class="status-dot ${hasIp ? 'online' : 'offline'}"></span>
      </div>
      ${powerDps ? `
      <div class="ctrl-row" style="margin-top:0.6rem">
        <span class="ctrl-label">Power</span>
        <label class="toggle">
          <input type="checkbox" onchange="sendCmd('${d.id}','${powerDps}',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>` : ''}
      <div style="display:grid;gap:0.45rem;margin-top:0.55rem">
        ${commandRows || '<div class="stat-card"><div class="stat-label">No sendable commands mapped.</div></div>'}
      </div>
      <div id="cmd-feedback" style="margin-top:0.5rem;font-size:0.74rem;color:var(--muted)"></div>
    </div>`;
  }).join("");
}

function safeIdPart(value) {
  return safeText(value).replace(/[^a-zA-Z0-9_-]/g, "_");
}

function getPowerDps(device) {
  const type = safeText(device?.type);
  const mapping = device?.mapping || {};
  const hasCode = (code) => Object.values(mapping).some(item => safeText(item?.code) === code);

  if (["breaker","consumption_breaker","general_circuit_breaker"].includes(type) && hasCode("switch")) return "switch";
  if (["heater","smart_plug"].includes(type) && hasCode("switch_1")) return "switch_1";
  if (type === "bulb" && hasCode("switch_led")) return "switch_led";
  if (type === "esmax" && hasCode("switch_lock")) return "switch_lock";
  if (hasCode("switch_1")) return "switch_1";
  if (hasCode("switch")) return "switch";
  return null;
}

function sendInlineCommand(deviceId, dps, inputId) {
  const el = document.getElementById(inputId);
  const value = parseManualValue(el?.value);
  sendCmd(deviceId, dps, value);
}

let currentDevice = null;
let pollInterval = null;
let isPolling = false;
let isCommandInFlight = false;
let commandCooldownUntil = 0;
const COMMAND_SETTLE_MS = 1800;

function inCommandCooldown() {
  return Date.now() < commandCooldownUntil;
}

function selectDevice(device) {
  // Clear any existing polling
  if (pollInterval) {
    clearInterval(pollInterval);
    pollInterval = null;
  }

  selectedId = device.id;
  currentDevice = device;
  renderGrid();
  const meta = TYPE_META[device.type] || TYPE_META.unknown;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panel-bar").style.background = meta.color;
  document.getElementById("panel-name").textContent = device.name;
  document.getElementById("panel-sub").textContent = device.product_name + " · " + (device.ip || "No IP");
  document.getElementById("panel").style.setProperty("--type-color", meta.color);

  const body = document.getElementById("panel-body");
  body.innerHTML = buildPanelStatic(device);

  // Auto-poll if IP exists, then start automatic polling every 5 seconds
  if (device.ip) {
    pollStatus(device);
    // Start automatic polling every 5 seconds
    pollInterval = setInterval(() => {
      if (currentDevice && currentDevice.id === device.id && !isCommandInFlight) {
        pollStatus(device, true);
      }
    }, 5000);
    // Update button text to show auto-polling is active
    setTimeout(() => {
      const btn = document.getElementById("poll-btn");
      if (btn) btn.innerHTML = '<span>⟳</span> Poll device now <span style="color:var(--accent);font-size:0.7rem">(Auto: 5s)</span>';
    }, 100);
  }
}

function buildPanelStatic(device) {
  const meta = TYPE_META[device.type] || TYPE_META.unknown;
  let html = `
    <div class="panel-section">
      <div class="panel-section-title">Device Info</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">ID</div><div class="stat-value" style="font-size:0.62rem">${device.id}</div></div>
        <div class="stat-card"><div class="stat-label">MAC</div><div class="stat-value" style="font-size:0.68rem">${device.mac || '—'}</div></div>
        <div class="stat-card"><div class="stat-label">IP</div><div class="stat-value">${device.ip || '—'}</div></div>
        <div class="stat-card"><div class="stat-label">Version</div><div class="stat-value">${device.version || '—'}</div></div>
      </div>
    </div>`;

  if (!device.ip) {
    html += `<div class="no-ip-msg">⚠ No IP address. Device may be offline, undiscovered, or cloud-only. Run <code>python -m tinytuya wizard</code> again to refresh.</div>`;
  }

  html += `
    <div class="panel-section" id="live-section">
      <div class="panel-section-title">Live Status</div>
      <div id="live-content"><span style="color:var(--muted);font-size:0.8rem">Not polled yet</span></div>
      ${device.ip ? `<button class="poll-btn" id="poll-btn" onclick="pollStatus(${JSON.stringify(device).replace(/"/g,'&quot;')})">
        <span>⟳</span> Poll device now
      </button>` : ''}
      <div id="cmd-feedback" style="margin-top:0.6rem;font-size:0.74rem;color:var(--muted)"></div>
    </div>`;

  const supportedCommands = getSupportedCommands(device);
  if (supportedCommands.length) {
    html += `
    <div class="panel-section">
      <div class="panel-section-title">Supported Commands</div>
      <div style="display:grid;gap:0.45rem">
        ${supportedCommands.map(cmd => `
          <div class="stat-card" style="padding:0.5rem 0.6rem">
            <div class="cmd-row">
              <div class="cmd-meta">
                <div class="cmd-title">${cmd.code} <span style="opacity:0.8">(DPS ${cmd.dps})</span></div>
                <div class="cmd-desc">${cmd.description}</div>
                <div class="cmd-allowed">Allowed: ${cmd.allowed}</div>
              </div>
              <input class="input-inline" id="cmd-val-${cmd.dps}" placeholder="${cmd.placeholder}">
              <button class="btn-action" onclick="sendCommandFromRow('${device.id}','${cmd.dps}','cmd-val-${cmd.dps}')">Send</button>
            </div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }

  // Device-specific controls
  if (device.ip) {
    html += buildManualCommandSender(device, supportedCommands);
    html += buildControls(device);
  }

  return html;
}

function getSupportedCommands(device) {
  const mapping = device?.mapping || {};
  const commands = [];
  const excludedPrefixes = [
    "cur_",
    "add_",
    "battery_",
    "door_",
    "presence_",
    "distance",
    "tamper",
    "fault",
    "alarm_",
    "voltage_",
    "electric_",
    "power_",
    "temp_",
    "bright_",
    "illum",
    "odometer",
    "trip",
    "speed",
  ];

  for (const [dpsKey, dps] of Object.entries(mapping)) {
    const code = String(dps?.code || "");
    if (!code) continue;
    const lowerCode = code.toLowerCase();
    const isTelemetry = excludedPrefixes.some(prefix => lowerCode.startsWith(prefix));
    if (isTelemetry) continue;
    const dpsType = String(dps?.type || "").toLowerCase();
    let allowed = "Any";

    if (dpsType === "boolean") {
      allowed = "true | false";
    } else if (dpsType === "enum") {
      const range = dps?.values?.range || [];
      allowed = range.length ? range.join(" | ") : "enum";
    } else if (dpsType === "integer") {
      const min = dps?.values?.min;
      const max = dps?.values?.max;
      const step = dps?.values?.step;
      const unit = dps?.values?.unit;
      const parts = [];
      if (min !== undefined) parts.push(`min ${min}`);
      if (max !== undefined) parts.push(`max ${max}`);
      if (step !== undefined) parts.push(`step ${step}`);
      if (unit !== undefined && unit !== "") parts.push(`unit ${unit}`);
      allowed = parts.length ? parts.join(", ") : "integer";
    } else if (dpsType === "string") {
      const maxlen = dps?.values?.maxlen;
      allowed = maxlen !== undefined ? `string (maxlen ${maxlen})` : "string";
    } else if (dpsType) {
      allowed = dpsType;
    }

    commands.push({
      dps: String(dpsKey),
      code,
      allowed,
      description: describeCommand(code),
      placeholder: placeholderForAllowed(allowed),
    });
  }

  return commands.sort((a, b) => {
    if (a.code === b.code) return a.dps.localeCompare(b.dps, undefined, { numeric: true });
    return a.code.localeCompare(b.code);
  });
}

function describeCommand(code) {
  const c = safeText(code).toLowerCase();
  if (c.includes("switch") || c.includes("power")) return "Turn device on/off.";
  if (c.includes("lock")) return "Enable or disable lock behavior.";
  if (c.includes("countdown")) return "Set auto-off countdown in seconds.";
  if (c.includes("relay_status")) return "Choose state after power restore.";
  if (c.includes("mode")) return "Change device operating mode.";
  if (c.includes("bright")) return "Adjust brightness level.";
  if (c.includes("temp")) return "Set temperature-related value.";
  if (c.includes("gear")) return "Set operating gear level.";
  return "Send this command value to the device.";
}

function placeholderForAllowed(allowed) {
  const a = safeText(allowed).toLowerCase();
  if (a.includes("true | false")) return "true or false";
  if (a.includes("min ") || a.includes("max ")) return "number";
  if (a.includes("|")) return a.split("|")[0].trim();
  if (a.includes("json")) return '{"key":"value"}';
  return "value";
}

function buildControls(device) {
  const type = device.type;
  const hasCode = (code) =>
    Object.values(device.mapping || {}).some((item) => String(item.code || "") === String(code));
  let html = `<div class="panel-section"><div class="panel-section-title">Controls</div>`;

  if (["breaker","consumption_breaker","general_circuit_breaker","heater","smart_plug"].includes(type)) {
    const powerDps = type === "heater" || type === "smart_plug" ? "switch_1" : "switch";
    html += `
      <div class="ctrl-row">
        <span class="ctrl-label">Power</span>
        <label class="toggle">
          <input type="checkbox" id="ctrl-power" onchange="sendCmd('${device.id}','${powerDps}',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>`;
    if (hasCode("child_lock")) {
      html += `
      <div class="ctrl-row">
        <span class="ctrl-label">Child Lock</span>
        <label class="toggle">
          <input type="checkbox" id="ctrl-lock" onchange="sendCmd('${device.id}','child_lock',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>`;
    }
    if (type !== "smart_plug") {
      html += `
      <div class="ctrl-row">
        <span class="ctrl-label">Relay on power-cut</span>
        <div style="display:flex;gap:0.4rem">
          <button class="btn-action" onclick="sendCmd('${device.id}','relay_status','power_on')">ON</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','relay_status','power_off')">OFF</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','relay_status','memory')">MEM</button>
        </div>
      </div>`;
    }
  }

  if (type === "bulb") {
    html += `
      <div class="ctrl-row">
        <span class="ctrl-label">Power</span>
        <label class="toggle">
          <input type="checkbox" id="ctrl-power" onchange="sendCmd('${device.id}','switch_led',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">Mode</span>
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
          <button class="btn-action" onclick="sendCmd('${device.id}','work_mode','white')">White</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','work_mode','colour')">Color</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','work_mode','scene')">Scene</button>
        </div>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">Brightness <span id="bright-val" class="stat-unit">500</span></span>
        <input type="range" min="10" max="1000" value="500" style="width:120px"
          oninput="document.getElementById('bright-val').textContent=this.value"
          onchange="sendCmd('${device.id}','bright_value',parseInt(this.value))">
      </div>`;
  }

  if (type === "esmax") {
    html += `
      <div class="ctrl-row">
        <span class="ctrl-label">Electronic Lock</span>
        <label class="toggle">
          <input type="checkbox" id="ctrl-elock" onchange="sendCmd('${device.id}','switch_lock',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">Headlights</span>
        <label class="toggle">
          <input type="checkbox" id="ctrl-lights" onchange="sendCmd('${device.id}','lights',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">Speed Gear</span>
        <div style="display:flex;gap:0.4rem">
          <button class="btn-action" onclick="sendCmd('${device.id}','gear',1)">Eco</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','gear',2)">Normal</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','gear',3)">Sport</button>
        </div>
      </div>`;
  }

  if (type === "smart_lock") {
    html += `
      <div class="ctrl-row">
        <span class="ctrl-label">Motion Detection (PIR)</span>
        <label class="toggle">
          <input type="checkbox" onchange="sendCmd('${device.id}','103',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label">PIR Sensitivity</span>
        <div style="display:flex;gap:0.4rem">
          <button class="btn-action" onclick="sendCmd('${device.id}','104','low')">Low</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','104','medium')">Mid</button>
          <button class="btn-action" onclick="sendCmd('${device.id}','104','high')">High</button>
        </div>
      </div>`;
  }

  html += `</div>`;
  return html;
}

function buildManualCommandSender(device, supportedCommands) {
  const options = supportedCommands.map(cmd =>
    `<option value="${cmd.code}">${cmd.code} (DPS ${cmd.dps})</option>`
  ).join("");

  return `
    <div class="panel-section">
      <div class="panel-section-title">Send Command</div>
      <div style="display:grid;gap:0.5rem">
        <div>
          <div class="stat-label" style="margin-bottom:0.25rem">DPS / Code</div>
          <input id="manual-dps" class="input-inline" list="manual-dps-list" placeholder="e.g. switch_1 or 1">
          <datalist id="manual-dps-list">${options}</datalist>
        </div>
        <div>
          <div class="stat-label" style="margin-bottom:0.25rem">Value</div>
          <input id="manual-value" class="input-inline" placeholder='e.g. true, 1, "white", power_on'>
        </div>
        <button class="btn-action" style="width:100%" onclick="sendManualCmd('${device.id}')">Send command</button>
      </div>
    </div>
  `;
}

function parseManualValue(input) {
  const raw = safeText(input).trim();
  if (!raw.length) return "";
  const lower = raw.toLowerCase();
  if (lower === "true") return true;
  if (lower === "false") return false;
  if (!Number.isNaN(Number(raw)) && raw !== "") return Number(raw);
  if ((raw.startsWith("{") && raw.endsWith("}")) || (raw.startsWith("[") && raw.endsWith("]")) || (raw.startsWith("\"") && raw.endsWith("\""))) {
    try { return JSON.parse(raw); } catch (_) { return raw; }
  }
  return raw;
}

function sendManualCmd(deviceId) {
  const dpsInput = document.getElementById("manual-dps");
  const valueInput = document.getElementById("manual-value");
  const feedback = document.getElementById("cmd-feedback");
  const dps = safeText(dpsInput?.value).trim();
  if (!dps) {
    if (feedback) {
      feedback.style.color = "var(--danger)";
      feedback.textContent = "Please enter a DPS/code.";
    }
    return;
  }
  const value = parseManualValue(valueInput?.value);
  sendCmd(deviceId, dps, value);
}

function sendCommandFromRow(deviceId, dps, inputId) {
  const valueInput = document.getElementById(inputId);
  const parsed = parseManualValue(valueInput?.value);
  sendCmd(deviceId, dps, parsed);
}

async function pollStatus(device, isAuto = false) {
  if (typeof device === 'string') device = allDevices.find(d => d.id === device);
  if (!device) return;

  // Avoid overlapping device requests and polling during commands.
  if (isPolling || isCommandInFlight || inCommandCooldown()) return;
  isPolling = true;
  const btn = document.getElementById("poll-btn");
  const content = document.getElementById("live-content");
  
  // Don't show loading for auto-polls
  if (!isAuto) {
    if (btn) { btn.classList.add("loading"); btn.innerHTML = '<span class="spinner"></span> Polling…'; }
    if (content) content.innerHTML = '<span style="color:var(--muted);font-size:0.8rem">Fetching…</span>';
  }

  try {
    const r = await fetch(`/api/device/${device.id}/status`);
    const data = await r.json();

    if (data.error) {
      content.innerHTML = `<div style="color:var(--danger);font-size:0.78rem">⚠ ${data.error}</div>`;
    } else {
      content.innerHTML = buildLiveStats(data, device.type);
      // Update toggle states
      updateToggles(data, device.type);
    }
  } catch (e) {
    content.innerHTML = `<div style="color:var(--danger);font-size:0.78rem">Network error: ${e.message}</div>`;
  } finally {
    isPolling = false;
    if (!isAuto) {
      if (btn) { 
        btn.classList.remove("loading"); 
        btn.innerHTML = '<span>⟳</span> Poll device now' + (pollInterval ? ' <span style="color:var(--accent);font-size:0.7rem">(Auto: 5s)</span>' : '');
      }
    }
  }
}

function buildLiveStats(data, type) {
  let html = '<div class="stat-grid">';
  if (["breaker","consumption_breaker","general_circuit_breaker"].includes(type)) {
    html += stat("State", data.state ? "ON" : "OFF") +
            stat("Volts", data.volts, "V") +
            stat("Amps", data.amps, "A") +
            stat("Watts", data.watts, "W") +
            stat("kWh", data.add_ele != null ? (data.add_ele/1000).toFixed(3) : "—", "kWh");
  } else if (type === "heater") {
    html += stat("State", data.state ? "ON" : "OFF") +
            stat("Countdown", data.countdown ?? "—", "s");
  } else if (type === "smart_plug") {
    html += stat("State", data.state ? "ON" : "OFF") +
            stat("Countdown", data.countdown ?? "—", "s");
  } else if (type === "bulb") {
    html += stat("State", data.state ? "ON" : "OFF") +
            stat("Mode", data.mode ?? "—") +
            stat("Brightness", data.brightness ?? "—") +
            stat("Color Temp", data.colour_temp ?? "—");
  } else if (["lock","smart_lock"].includes(type)) {
    html += stat("Door", data.door_status ? "Open" : "Closed") +
            stat("Battery", data.battery ?? "—", "%") +
            stat("Alarms", data.alarms ?? "—");
  } else if (type === "esmax") {
    html += stat("Lock", data.switch_lock ? "Locked" : "Unlocked") +
            stat("Gear", data.gear ?? "—") +
            stat("Speed", data.speed ?? "—", "km/h") +
            stat("Battery", data.battery ?? "—", "%") +
            stat("Odometer", data.odometer ?? "—", "km") +
            stat("Trip", data.trip ?? "—", "km");
  } else if (type === "presence_sensor") {
    html += stat("Presence", data.presence ? "Detected" : "None") +
            stat("Lux", data.illuminance ?? "—") +
            stat("Distance", data.distance ?? "—", "cm");
  } else if (type === "contact_sensor") {
    html += stat("Door", data.door_open ? "Open" : "Closed") +
            stat("Battery", data.battery_pct ?? "—", "%") +
            stat("Status", data.battery_state ?? "—") +
            stat("Tamper", data.tamper ? "⚠ YES" : "OK");
  }
  html += '</div>';

  return html;
}

function stat(label, value, unit = "") {
  return `<div class="stat-card">
    <div class="stat-label">${label}</div>
    <div class="stat-value">${value ?? "—"}<span class="stat-unit">${unit ? " "+unit : ""}</span></div>
  </div>`;
}

function updateToggles(data, type) {
  const p = document.getElementById("ctrl-power");
  if (p && data.state !== undefined) p.checked = !!data.state;
  const l = document.getElementById("ctrl-lock");
  if (l && data.child_lock !== undefined) l.checked = !!data.child_lock;
  const el = document.getElementById("ctrl-elock");
  if (el && data.switch_lock !== undefined) el.checked = !!data.switch_lock;
  const li = document.getElementById("ctrl-lights");
  if (li && data.lights !== undefined) li.checked = !!data.lights;
  const cr = document.getElementById("ctrl-cruise");
  if (cr && data.cruise_control !== undefined) cr.checked = !!data.cruise_control;
}

async function sendCmd(deviceId, dps, value) {
  const feedback = document.getElementById("cmd-feedback");
  if (isCommandInFlight) {
    if (feedback) {
      feedback.style.color = "var(--muted)";
      feedback.textContent = "Previous command still in progress…";
    }
    return;
  }
  if (feedback) {
    feedback.style.color = "var(--muted)";
    feedback.textContent = `Sending command: ${dps} = ${JSON.stringify(value)}`;
  }
  isCommandInFlight = true;
  commandCooldownUntil = Date.now() + COMMAND_SETTLE_MS;
  try {
    const r = await fetch(`/api/device/${deviceId}/command`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ dps, value })
    });
    const data = await r.json();
    if (!data.ok) {
      const dbg = data.debug
        ? ` (requested: ${data.debug.requested_dps}, resolved: ${data.debug.resolved_dps_key})`
        : "";
      const msg = "Command failed: " + (data.error || "unknown error") + dbg;
      if (feedback) {
        feedback.style.color = "var(--danger)";
        feedback.textContent = msg;
      } else {
        alert(msg);
      }
      return;
    }
    const dbg = data.debug
      ? `requested: ${data.debug.requested_dps}, resolved: ${data.debug.resolved_dps_key}`
      : "no debug info";
    if (feedback) {
      feedback.style.color = "var(--accent)";
      feedback.textContent = `Command sent successfully (${dbg})`;
    }
    if (currentDevice && currentDevice.id === deviceId) {
      commandCooldownUntil = Date.now() + COMMAND_SETTLE_MS;
      setTimeout(() => {
        if (currentDevice && currentDevice.id === deviceId) {
          pollStatus(currentDevice, true);
        }
      }, COMMAND_SETTLE_MS);
    }
  } catch (e) {
    const msg = "Network error: " + e.message;
    if (feedback) {
      feedback.style.color = "var(--danger)";
      feedback.textContent = msg;
    } else {
      alert(msg);
    }
  } finally {
    isCommandInFlight = false;
  }
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
  selectedId = null;
  renderGrid();
}

function downloadCommandsMatrix(format) {
  const url = format === "csv" ? "/api/commands-matrix.csv" : "/api/commands-matrix";
  window.open(url, "_blank");
}

loadDevices();
